  description: "Agentic engineering project generation, existing repository bootstrap, and documentation practices."
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: tutorials/generate-first-repository.qmd
        text: Getting Started
      - href: reference/cli-and-metadata.qmd
        text: Reference
      - href: explanation/architecture.qmd
        text: Architecture
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - index.qmd
      - section: Tutorials
        contents:
          - tutorials/generate-first-repository.qmd
      - section: How-to
        contents:
          - how-to/generate-repository.qmd
          - how-to/bootstrap-existing-repository.qmd
          - how-to/write-documentation.qmd
      - section: Reference
        contents:
          - reference/cli-and-metadata.qmd
          - reference/bootstrap-lifecycle.qmd
          - reference/templates.qmd
          - reference/profiles-and-skills.qmd
      - section: Explanation
        contents:
