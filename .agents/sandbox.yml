profiles:
  sandbox-light:
    tool: "zerobox"
    purpose: "run generated code, tests, installs, and unknown scripts with constrained writes and network"
    guidance:
      - "Default to no network for generated or unknown code"
      - "Allow writes only to explicit build, temp, or output directories"
      - "Use snapshots or restore behavior for risky package or codegen commands"
    setup:
      - "Install or configure the chosen sandbox tool outside repo-familiar before running untrusted commands"
    verify:
      - "Run the sandbox tool's help/status command before using it for package installs or generated code"
  sandbox-micropython-wasm:
    tool: "micropython-wasm plus Wasmtime"
    purpose: "evaluate small Python-like snippets with no network and no host filesystem access by default"
    guidance:
      - "Use fresh `run()` executions for one-shot untrusted snippets so globals and imports do not persist"
      - "Use `MicroPythonSession` only when true resident state is needed and the snippet trust boundary is clear"
      - "Use `MicroPythonReplaySession` only when replayed side effects are acceptable and documented"
      - "Preopen only explicit read-only fixture directories; never preopen a project root, home directory, `/`, or shared temp directory"
      - "Set memory, fuel, wall-clock, and host output limits; use separate worker processes or containers for higher-risk workloads"
      - "Remember MicroPython is not CPython and lacks some modules such as hashlib.sha256 and zlib in the current bundled artifact"
    setup:
      - "Install `micropython-wasm` in the project or user environment before relying on this profile"
    verify:
      - "micropython-wasm -c \"print(1 + 1)\""
  sandbox-microvm:
    tool: "smolvm"
    purpose: "run untrusted or model-generated Linux workloads behind a guest-kernel and hypervisor boundary"
    guidance:
      - "Keep guest networking disabled by default; when egress is required, allow only explicit hosts or CIDRs and test both allowed and blocked destinations"
      - "Expose only required source paths read-only and use a separate writable output directory; do not mount home directories, credentials, shared temporary directories, or container runtime sockets"
      - "Do not inject secrets or forward an SSH agent to untrusted workloads"
      - "Set conservative CPU, memory, disk, wall-clock, and output limits, and delete machines on success, failure, timeout, and interruption"
      - "Add host-account separation or operating-system confinement when hostile local co-tenants are in scope; standalone smolvm is not a multi-user control plane"
      - "Re-run network, mount, resource, and cleanup checks after every upgrade because only the latest release is supported"
    setup:
      - "Install an explicitly reviewed current `smolvm` release outside repo-familiar and verify its published SHA-256 checksum"
      - "Confirm the host meets the current virtualization and architecture requirements before relying on this profile"
    verify:
      - "smolvm --version"
      - "smolvm machine run --image alpine:3.20 -- sh -c \"if wget -q -T 5 -O /dev/null https://example.com; then exit 1; fi\""
      - "In a disposable directory, prove that a read-only source mount rejects writes while a separate output mount accepts them"
  sandbox-agent-runtime:
    tool: "OpenShell"
    purpose: "policy-governed runtime for longer autonomous agent sessions"
    guidance:
      - "Use declarative filesystem, network, process, and inference policies"
      - "Treat credential providers as runtime injection, not repository secrets"
      - "Prefer for production-maintenance or high-autonomy workflows"
    setup:
      - "Configure OpenShell policies outside the repository before using this profile for autonomous sessions"
    verify:
      - "Run the OpenShell policy validation or status command for the target workspace"
