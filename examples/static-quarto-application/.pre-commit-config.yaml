repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
      - id: reproduce
        name: deterministic reproduction
        entry: uv run reproduce --check
        language: system
        pass_filenames: false
      - id: quarto-docs
        name: render documentation
        entry: quarto render docs
        language: system
        pass_filenames: false
      - id: quarto-app
        name: render static application
        entry: quarto render app
        language: system
        pass_filenames: false

