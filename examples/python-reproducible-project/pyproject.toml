[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "python-reproducible-project"
version = "0.1.0"
description = "Executable reproducible data science project generated by repo-familiar."
requires-python = ">=3.13,<3.14"
dependencies = [
  "apache-hamilton>=1.89",
  "polars>=1.0",
  "pydantic>=2.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.11",
]

[project.scripts]
reproduce = "python_reproducible_project.reproduce:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"python_reproducible_project" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["python_reproducible_project"]

[[tool.mypy.overrides]]
module = ["hamilton", "hamilton.*"]
ignore_missing_imports = true
