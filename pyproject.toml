[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-familiar"
version = "0.1.0"
description = "Project generator for agentic engineering defaults."
requires-python = ">=3.11"
dependencies = ["questionary>=2.0"]

[project.scripts]
repo-familiar = "repo_familiar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_familiar = [
  "templates/basic/.gitignore.tmpl",
  "templates/basic/*",
  "templates/basic/.agents/*",
  "templates/basic/docs/*",
  "templates/skills/*/*",
  "templates/skills/*/*/*",
]
